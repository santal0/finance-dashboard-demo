<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智财风控驾驶舱</title>
  <style>
    /* =========================
       基础样式：可在这里调整整体色调
       ========================= */
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --line: #e5eaf2;
      --text: #1f2a3d;
      --muted: #667085;
      --nav: #172235;
      --nav-active: #253b5b;
      --blue: #2d6cdf;
      --blue-soft: #eaf2ff;
      --cyan: #1c9bb6;
      --green: #1f9d62;
      --green-soft: #e8f6ef;
      --orange: #d9822b;
      --orange-soft: #fff4e5;
      --red: #d64545;
      --red-soft: #fff0f0;
      --shadow: 0 8px 24px rgba(31, 42, 61, 0.07);
      --radius: 8px;
      --sidebar: 232px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* =========================
       左侧导航
       ========================= */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      background: var(--nav);
      color: #d9e3f3;
      padding: 22px 16px;
      z-index: 20;
    }

    .brand {
      padding: 4px 8px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 18px;
    }

    .brand-title {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 12px;
      line-height: 1.5;
      color: #aebbd0;
    }

    .nav-list {
      display: grid;
      gap: 8px;
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #d9e3f3;
      text-align: left;
      padding: 12px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.18s, color 0.18s, transform 0.18s;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--nav-active);
      color: #ffffff;
    }

    .nav-item:active {
      transform: translateY(1px);
    }

    /* =========================
       顶部栏与主内容
       ========================= */
    .main {
      margin-left: var(--sidebar);
      width: calc(100% - var(--sidebar));
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 28px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .top-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .top-subtitle,
    .top-note {
      color: var(--muted);
      line-height: 1.5;
    }

    .top-note {
      white-space: nowrap;
      background: #eef3f9;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
    }

    .content {
      padding: 24px 28px 36px;
    }

    .page {
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .section-desc {
      color: var(--muted);
      margin: 0;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      border-radius: var(--radius);
      padding: 9px 13px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(31, 42, 61, 0.04);
      transition: transform 0.16s, border-color 0.16s, background 0.16s;
      min-height: 38px;
    }

    .btn:hover {
      border-color: #bfd0e8;
      background: #f8fbff;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--blue);
      color: #ffffff;
      border-color: var(--blue);
    }

    .btn.primary:hover {
      background: #245fc4;
    }

    .btn.filter.active {
      background: var(--blue-soft);
      border-color: #9fc0f5;
      color: #174eab;
      font-weight: 700;
    }

    /* =========================
       通用卡片、指标、图表
       ========================= */
    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .metrics {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      margin-bottom: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .metric-card {
      min-height: 112px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-label {
      color: var(--muted);
      line-height: 1.5;
    }

    .metric-value {
      font-size: 26px;
      font-weight: 800;
      color: #162238;
      margin-top: 10px;
    }

    .metric-tip {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .card-title small {
      color: var(--muted);
      font-weight: 400;
    }

    .ai-card {
      background: var(--blue-soft);
      border-color: #cfe0fb;
      color: #17345e;
      line-height: 1.75;
    }

    .ai-card strong {
      display: block;
      margin-bottom: 8px;
      color: #12315d;
      font-size: 15px;
    }

    .cash-flow-card {
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #f4fbf7 100%);
      border-color: #cfeadc;
    }

    .formula-label {
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .formula-main {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.4;
      color: #162238;
    }

    .formula-result {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 800;
    }

    .chart {
      height: 230px;
      position: relative;
    }

    .line-chart svg,
    .compare-chart svg {
      width: 100%;
      height: 190px;
      display: block;
    }

    .axis-labels {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      padding-top: 6px;
    }

    .bar-list {
      display: grid;
      gap: 12px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 90px 1fr 58px;
      gap: 10px;
      align-items: center;
    }

    .bar-name {
      color: #344054;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      height: 10px;
      background: #edf1f7;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4b83e6, #62b1d0);
    }

    .bar-value {
      text-align: right;
      color: var(--muted);
      font-size: 12px;
    }

    .donut-wrap {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 18px;
      align-items: center;
      min-height: 190px;
    }

    .donut {
      width: 142px;
      height: 142px;
      border-radius: 50%;
      background:
        conic-gradient(#2d6cdf 0 42%, #1c9bb6 42% 67%, #d9822b 67% 84%, #1f9d62 84% 100%);
      position: relative;
      margin: auto;
    }

    .donut::after {
      content: "";
      position: absolute;
      inset: 26px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .legend {
      display: grid;
      gap: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .column-chart {
      height: 190px;
      display: flex;
      align-items: end;
      gap: 20px;
      padding: 20px 8px 2px;
      border-bottom: 1px solid var(--line);
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 44px;
    }

    .column-fill {
      width: 36px;
      border-radius: 6px 6px 0 0;
      background: #6f9be8;
    }

    .column.red .column-fill { background: var(--red); }
    .column.orange .column-fill { background: var(--orange); }
    .column.green .column-fill { background: var(--green); }

    .column-label {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    /* =========================
       表格与风险标签
       ========================= */
    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      line-height: 1.55;
    }

    th {
      background: #f7f9fc;
      color: #344054;
      font-weight: 700;
      white-space: nowrap;
    }

    tr:hover td {
      background: #fbfdff;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tag.high {
      color: var(--red);
      background: var(--red-soft);
      border: 1px solid #ffd0d0;
    }

    .tag.mid {
      color: var(--orange);
      background: var(--orange-soft);
      border: 1px solid #ffe0b5;
    }

    .tag.low {
      color: var(--green);
      background: var(--green-soft);
      border: 1px solid #bfe8d2;
    }

    .risk-card {
      border-left: 4px solid var(--orange);
    }

    .risk-card.high {
      border-left-color: var(--red);
    }

    .risk-card.low {
      border-left-color: var(--green);
    }

    .risk-title {
      font-weight: 800;
      margin-bottom: 8px;
    }

    .risk-text {
      color: var(--muted);
      line-height: 1.7;
      margin: 0;
    }

    .progress-list {
      display: grid;
      gap: 13px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      color: #344054;
    }

    .progress-track {
      height: 10px;
      border-radius: 999px;
      background: #edf1f7;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: #2d6cdf;
    }

    .progress-fill.warn {
      background: var(--orange);
    }

    .progress-fill.danger {
      background: var(--red);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .report {
      line-height: 1.85;
      color: #26364d;
    }

    .report h2 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .report h3 {
      margin: 18px 0 8px;
      font-size: 16px;
      color: #172235;
    }

    .report p,
    .report li {
      color: #43546d;
    }

    .report ul {
      padding-left: 22px;
      margin: 8px 0;
    }

    .explain-list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .explain-item {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--green-soft);
      color: var(--green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      font-weight: 800;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: min(460px, calc(100vw - 48px));
      background: #172235;
      color: #ffffff;
      border-radius: var(--radius);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
      padding: 14px 16px;
      line-height: 1.6;
      transform: translateY(18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1180px) {
      .metrics {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid.cols-4,
      .grid.cols-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 840px) {
      :root {
        --sidebar: 0px;
      }

      .sidebar {
        position: static;
        width: 100%;
        min-height: auto;
      }

      .app {
        display: block;
      }

      .main {
        width: 100%;
        margin-left: 0;
      }

      .topbar,
      .section-head {
        flex-direction: column;
        align-items: stretch;
      }

      .top-note {
        white-space: normal;
      }

      .metrics,
      .grid.cols-2,
      .grid.cols-3,
      .grid.cols-4 {
        grid-template-columns: 1fr;
      }

      .donut-wrap {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

              <polyline points="${points}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
              ${points.split(" ").map(p => {
                const [x, y] = p.split(",");
                return `<circle cx="${x}" cy="${y}" r="4" fill="#ffffff" stroke="${color}" stroke-width="3" />`;

    function dualLineChart(title, labels, series, small = "百分比") {
      return `
        <div class="card">
          <div class="card-title">${title}<small>${small}</small></div>
          <div class="chart line-chart">
            <svg viewBox="0 0 520 190" preserveAspectRatio="none" aria-hidden="true">
              <line x1="20" y1="165" x2="500" y2="165" stroke="#e5eaf2" />
              <line x1="20" y1="120" x2="500" y2="120" stroke="#eef2f7" />
              <line x1="20" y1="75" x2="500" y2="75" stroke="#eef2f7" />
              <text x="0" y="78" font-size="11" fill="#98a2b3">75%</text>
              <text x="0" y="123" font-size="11" fill="#98a2b3">50%</text>
              <text x="0" y="168" font-size="11" fill="#98a2b3">0%</text>
              ${series.map(item => `
                <polyline points="${item.points}" fill="none" stroke="${item.color}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                ${item.points.split(" ").map(p => {
                  const [x, y] = p.split(",");
                  return `<circle cx="${x}" cy="${y}" r="4" fill="#ffffff" stroke="${item.color}" stroke-width="3" />`;
                }).join("")}
              `).join("")}
            </svg>
            <div class="axis-labels">${labels.map(label => `<span>${label}</span>`).join("")}</div>
          </div>
          <div class="legend" style="grid-template-columns:repeat(${series.length}, max-content);margin-top:10px;">
            ${series.map(item => `<div class="legend-left"><span class="dot" style="background:${item.color}"></span>${item.name}</div>`).join("")}
          </div>
        </div>
      `;
    }

    function barList(title, data, small = "单位：万元") {
      return `
        <div class="card">
          <div class="card-title">${title}<small>${small}</small></div>
          <div class="bar-list">
            ${data.map(item => `
              <div class="bar-row">
                <div class="bar-name">${item.name}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${item.percent}%"></div></div>
                <div class="bar-value">${item.value}</div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function donutChart(title, data = overviewExpenseSegments) {
      let cursor = 0;
      const gradient = data.map(item => {
        const start = cursor;
        cursor += item.percent;
        return `${item.color} ${start}% ${cursor}%`;
      }).join(", ");
      return `
        <div class="card">
          <div class="card-title">${title}<small>模拟占比</small></div>
          <div class="donut-wrap">
            <div class="donut" style="background:conic-gradient(${gradient})"></div>
            <div class="legend">
              ${data.map(item => `
                <div class="legend-item"><span class="legend-left"><span class="dot" style="background:${item.color}"></span>${item.name}</span><strong>${item.percent}%</strong></div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function columnChart(title, data) {
      return `
        <div class="card">
          <div class="card-title">${title}<small>笔数</small></div>
          <div class="column-chart">
            ${data.map(item => `
              <div class="column ${item.type}">
                <div class="column-fill" style="height:${item.height}px"></div>
                <div class="column-label">${item.label}<br>${item.value}</div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function progressCard(title, data, small = "预算消耗") {
      return `
        <div class="card">
          <div class="card-title">${title}<small>${small}</small></div>
          <div class="progress-list">
            ${data.map(item => `
              <div>
                <div class="progress-head"><span>${item.name}</span><strong>${item.value}%</strong></div>
                <div class="progress-track"><div class="progress-fill ${item.value >= 85 ? "danger" : item.value >= 75 ? "warn" : ""}" style="width:${item.value}%"></div></div>

          </div>
        </div>
      `;
    }

          <div class="card risk-card high"><div class="risk-title">独栋办公</div><p class="risk-text">出售率低于目标，待售面积偏高，需推动销售去化。</p></div>
          <div class="card ai-card"><strong>AI 处理建议</strong>优先处理工程付款超前、招待费预算超支、回款延期和房屋资产去化风险。建议生成风控日报后推送至财务负责人、项目负责人和租售负责人。</div>
        </div>
        <div class="card">
          <div class="card-title">风险列表表格<small id="riskCount">${riskRows.length} 条</small></div>
          <div id="riskTable"></div>
        </div>
      `;
      renderRiskTable();
    }

    function renderRiskTable() {
      const level = document.querySelector("#levelFilters .active")?.dataset.level || "全部";
      const type = document.querySelector("#typeFilters .active")?.dataset.type || "全部";
      const filtered = riskRows.filter(row => {
        const levelMatch = level === "全部" || row[3] === level;
        const typeMatch = type === "全部" || row[1] === type;
        return levelMatch && typeMatch;
      });
      document.getElementById("riskTable").innerHTML = table(["预警时间", "风险类型", "关联对象", "风险等级", "风险说明", "建议处理动作"], filtered);
      document.getElementById("riskCount").textContent = `${filtered.length} 条`;
    }

    function renderReport() {
      pages.report.innerHTML = `
        ${pageHead("AI 分析报告", "模拟由 AI 生成的财务风控与资金预测报告，可导出为 Markdown 文件。",
          actionButtons(["重新生成报告", "下载报告", "创建飞书文档", "发送到财务群"]))}
        <div class="card report">
          ${markdownToHtml(reportMarkdown)}
        </div>
      `;
    }

    function markdownToHtml(markdown) {
      return markdown
        .split("\n")
        .map(line => {
          if (line.startsWith("# ")) return `<h2>${line.slice(2)}</h2>`;
          if (line.startsWith("## ")) return `<h3>${line.slice(3)}</h3>`;
          if (line.startsWith("- ")) return `<li>${line.slice(2)}</li>`;
          if (line.trim() === "") return "";
          return `<p>${line}</p>`;
        })
        .join("")
        .replace(/(<li>.*?<\/li>)+/g, match => `<ul>${match}</ul>`);
    }

    function renderAbout() {
      pages.about.innerHTML = `
        ${pageHead("系统说明", "当前 Demo 是用于企业 AI 比赛答辩展示的 Throwaway Prototype，不连接任何真实系统。",
          actionButtons(["模拟检查接入状态", "查看正式版规划"]))}
        <div class="grid cols-2">
          <div class="card">
            <div class="card-title">当前原型边界</div>
            <div class="explain-list">
              <div class="explain-item"><span class="check">✓</span><div>当前版本使用脱敏模拟数据，所有数据均写死在前端 JavaScript 数组中。</div></div>
              <div class="explain-item"><span class="check">✓</span><div>当前版本只验证界面、流程和 AI 介入点，适合比赛答辩截图和现场演示。</div></div>
              <div class="explain-item"><span class="check">✓</span><div>当前版本不连接真实飞书、不处理真实财务数据、不调用真实大模型 API。</div></div>
              <div class="explain-item"><span class="check">✓</span><div>当前文件为纯前端静态页面，双击 index.html 即可在浏览器中打开。</div></div>
              <div class="explain-item"><span class="check">✓</span><div>当前版本仍是 Mock 数据原型，页面中的收入、费用、工程付款和房屋资产数据均为演示样例。</div></div>
            </div>
          </div>
          <div class="card">
            <div class="card-title">正式版接入规划</div>
            <div class="explain-list">
              <div class="explain-item"><span class="check">✓</span><div>接入飞书审批，采集报销审批、工程付款审批和经营协同流程数据。</div></div>
              <div class="explain-item"><span class="check">✓</span><div>接入飞书多维表格，沉淀风控台账、处理状态和责任人协同记录。</div></div>
              <div class="explain-item"><span class="check">✓</span><div>接入财务系统、预算系统和合同系统，形成真实资金预测、预算预警和合同节点校验。</div></div>
              <div class="explain-item"><span class="check">✓</span><div>接入租赁系统、销售系统和回款台账，形成营业收入与回款状态分析。</div></div>
              <div class="explain-item"><span class="check">✓</span><div>接入房屋资产台账，形成公寓、商业写字楼、独栋办公的租售和自用面积分析。</div></div>
              <div class="explain-item"><span class="check">✓</span><div>接入大模型 API、真实风控规则和权限系统，完成风险识别、报告生成和闭环处置。</div></div>
            </div>
          </div>
        </div>
      `;
    }

    function downloadReport() {
      const blob = new Blob([reportMarkdown], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "财务风控与资金预测报告.md";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("报告下载已生成：当前为 Mock Markdown 文件。");
    }

    /* ==========================================================
       初始化与交互绑定
       ========================================================== */
    function renderAllPages() {
      renderOverview();
      renderIncome();
      renderExpense();
      renderProject();
      renderAsset();
      renderRisk();
      renderReport();
      renderAbout();
    }

    function switchPage(pageId) {
      document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.toggle("active", item.dataset.page === pageId);
      });
      document.querySelectorAll(".page").forEach(page => {
        page.classList.toggle("active", page.id === pageId);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.addEventListener("click", event => {
      const nav = event.target.closest(".nav-item");
      if (nav) {
        switchPage(nav.dataset.page);
        return;
      }

      const levelButton = event.target.closest("[data-level]");
      if (levelButton) {
        document.querySelectorAll("[data-level]").forEach(btn => btn.classList.remove("active"));
        levelButton.classList.add("active");
        renderRiskTable();
        showToast("筛选条件已更新。");
        return;
      }

      const typeButton = event.target.closest("[data-type]");
      if (typeButton) {
        document.querySelectorAll("[data-type]").forEach(btn => btn.classList.remove("active"));
        typeButton.classList.add("active");
        renderRiskTable();
        showToast("筛选条件已更新。");
        return;
      }

      const action = event.target.closest("[data-action]");
      if (action) {
        if (action.textContent.trim() === "下载报告") {
          downloadReport();
        } else {
          showToast();
        }
      }
    });

    renderAllPages();
  </script>
</body>
</html>
